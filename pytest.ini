[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
addopts = -ra --tb=short
norecursedirs = scripts coq build .venv .git .vscode .github artifacts archive
per_test_timeout = 15
markers =
    slow: marks tests as slow (may take significant time)
    coq: marks tests that require the Coq toolchain
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
    ignore::pytest.PytestCollectionWarning
    ignore::ImportWarning
