name: MetaCoq probe

# One-off feasibility check: build MetaCoq 1.2.1+8.18 Template from pinned
# source against Ubuntu's Coq 8.18, then compile the vendored L extraction
# tactics and the L -> MMA chain, and extract a function.
# Runs only on pushes whose head commit message contains [metacoq-probe].

on:
  push:
    branches-ignore: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  METACOQ_TAG: v1.2.1-8.18
  METACOQ_SHA256: 2b5057265344e661371591eaa5d94da9cb45ce4e88867a6cce517f478395a9fe

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[metacoq-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Coq and OCaml development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            coq libcoq-core-ocaml-dev libcoq-equations ocaml ocaml-findlib libstdlib-shims-ocaml-dev
          coqc --version
          ocamlfind list 2>/dev/null | grep -E "^coq-core|stdlib-shims" | head

      - name: Build and install MetaCoq Template from pinned source
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          curl -sSL -o metacoq.tar.gz "https://github.com/MetaRocq/metarocq/archive/refs/tags/${METACOQ_TAG}.tar.gz"
          echo "${METACOQ_SHA256}  metacoq.tar.gz" | sha256sum -c -
          tar -xzf metacoq.tar.gz
          cd metarocq-*
          ./configure.sh
          start=$SECONDS
          for part in utils common template-coq; do
            make -C "$part" -j4
            sudo make -C "$part" install
          done
          echo "MetaCoq Template built in $((SECONDS-start))s"

      - name: Compile the vendored L tactics and the L -> MMA chain
        run: |
          set -Eeuo pipefail
          find vendor/coq-undecidability/theories -name '*.vo' -exec touch {} +
          cd vendor/coq-undecidability/theories
          coq_makefile -f _CoqProject -o Makefile.probe
          start=$SECONDS
          make -f Makefile.probe -j4 L/Tactics/LTactics.vo \
            MinskyMachines/Reductions/L_computable_to_MMA_computable.vo
          echo "L chain built in $((SECONDS-start))s"

      - name: Extract a function and check assumptions
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/Probe.v" <<'EOF'
          From Undecidability.L Require Import Tactics.LTactics Datatypes.LNat.
          From Undecidability.MinskyMachines.Reductions Require Import L_computable_to_MMA_computable.
          Definition dbl (n : nat) : nat := n + n.
          Instance term_dbl : computable dbl.
          Proof. extract. Qed.
          Print Assumptions term_dbl.
          Print Assumptions L_computable_to_MMA_computable.
          EOF
          coqc -Q vendor/coq-undecidability/theories Undecidability "$RUNNER_TEMP/Probe.v"
