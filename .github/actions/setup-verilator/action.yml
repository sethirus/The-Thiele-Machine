name: Pinned Verilator
description: Build and cache the simulator used by the board and RAM regressions
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      id: simulator
      with:
        path: ~/.cache/thiele/verilator-5.050
        key: verilator-5.050-${{ runner.os }}-${{ runner.arch }}-848d926-v1
    - name: Install simulator build dependencies
      if: steps.simulator.outputs.cache-hit != 'true'
      uses: ./.github/actions/apt-install
      with:
        packages: autoconf bison flex libfl-dev g++ make perl help2man
    - name: Build pinned upstream source
      if: steps.simulator.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        source_dir="$RUNNER_TEMP/verilator-848d926"
        archive="$RUNNER_TEMP/verilator-5.050.tar.gz"
        curl --fail --location --retry 3 \
          https://codeload.github.com/verilator/verilator/tar.gz/848d926ebd4addacacd294dc84e35d9d4ae8078c \
          --output "$archive"
        echo "0e8e4243a98ca7d806a04b8cb19d5f0ed18a246da8f8f1725a075d5ee2e0964e  $archive" | sha256sum --check
        mkdir -p "$source_dir"
        tar -xzf "$archive" --strip-components=1 -C "$source_dir"
        cd "$source_dir"
        autoconf
        ./configure --prefix="$HOME/.cache/thiele/verilator-5.050"
        make -j"$(nproc)"
        make install
    - name: Select and verify simulator
      shell: bash
      run: |
        set -euo pipefail
        simulator_bin="$HOME/.cache/thiele/verilator-5.050/bin"
        "$simulator_bin/verilator" --version | tee "$RUNNER_TEMP/verilator-version.txt"
        grep -q '^Verilator 5\.050 ' "$RUNNER_TEMP/verilator-version.txt"
        echo "$simulator_bin" >> "$GITHUB_PATH"
