name: Set up the Bluespec compiler
description: >
  Install bsc 2024.07 (the ubuntu-22.04 release build, the compiler that produced the tracked
  CPU Verilog) from the pinned release tarball, checked by size and sha256. The release
  publishes no digests; the sha256 below is pinned on first use and every later download
  must match it.
outputs:
  bluespecdir:
    description: The bsc library directory (BLUESPECDIR).
    value: ${{ steps.install.outputs.bluespecdir }}
runs:
  using: composite
  steps:
    - name: Install bsc runtime dependencies
      uses: ./.github/actions/apt-install
      with:
        packages: libgmp10 tcl8.6 libtcl8.6 iverilog

    - name: Download, check, and unpack bsc 2024.07
      id: install
      shell: bash
      env:
        BSC_URL: https://github.com/B-Lang-org/bsc/releases/download/2024.07/bsc-2024.07-ubuntu-22.04.tar.gz
        BSC_SIZE: "25490740"
        BSC_SHA256: ""
      run: |
        set -Eeuo pipefail
        tarball="$RUNNER_TEMP/bsc-2024.07-ubuntu-22.04.tar.gz"
        curl -fsSL --retry 3 -o "$tarball" "$BSC_URL"
        size=$(stat -c %s "$tarball")
        sha=$(sha256sum "$tarball" | cut -d' ' -f1)
        echo "bsc tarball: ${size} bytes, sha256 ${sha}"
        if [[ "$size" != "$BSC_SIZE" ]]; then
          echo "::error::bsc tarball size ${size} differs from the release's ${BSC_SIZE}"
          exit 1
        fi
        if [[ -z "$BSC_SHA256" ]]; then
          echo "::error::no sha256 pinned yet; pin BSC_SHA256=${sha} in .github/actions/setup-bsc/action.yml"
          exit 1
        fi
        if [[ "$sha" != "$BSC_SHA256" ]]; then
          echo "::error::bsc tarball sha256 ${sha} differs from the pinned ${BSC_SHA256}"
          exit 1
        fi
        tar -xzf "$tarball" -C "$RUNNER_TEMP"
        root="$RUNNER_TEMP/bsc-2024.07-ubuntu-22.04"
        echo "$root/bin" >> "$GITHUB_PATH"
        echo "bluespecdir=$root/lib" >> "$GITHUB_OUTPUT"
        "$root/bin/bsc" -v 2>&1 | head -2 || true
