name: Set up MetaCoq Template
description: >
  Build MetaCoq 1.2.1+8.18 (utils, common, template-coq) from pinned, checksum-verified
  source against the system Coq 8.18 and install it. The vendored L extraction tactics
  (Undecidability.L.Tactics) need it; extracted terms and proofs are checked by the Coq kernel.
runs:
  using: composite
  steps:
    - name: Install MetaCoq build dependencies
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends \
          libcoq-core-ocaml-dev libcoq-equations libstdlib-shims-ocaml-dev
        echo "METACOQ_COQ=$(coqc --version | head -n1 | tr -s ' ' '_' | tr -d '(),')" >> "$GITHUB_ENV"

    - name: Mark tracked vendored Coq outputs current
      # The vendored undecidability .vo files are tracked and were compiled from
      # the pinned sources. A fresh checkout gives sources and outputs arbitrary
      # relative timestamps; without this, building the new L modules would make
      # rebuild some tracked outputs and leave the rest, an inconsistent mix.
      shell: bash
      run: find vendor/coq-undecidability/theories -name '*.vo' -exec touch {} +

    - name: Cache MetaCoq build
      id: cache-metacoq
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/metarocq-1.2.1-8.18
        key: metacoq-v1.2.1-8.18-${{ runner.os }}-${{ env.METACOQ_COQ }}

    - name: Build (on a cache miss) and install MetaCoq Template
      shell: bash
      run: JOBS=4 bash scripts/install_metacoq.sh "$RUNNER_TEMP"
